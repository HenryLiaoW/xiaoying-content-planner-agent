[project]
name = "xiaoying-content-planner-agent"
version = "0.1.0"
description = "小影科技校招笔试 · 题二 内容任务规划 Agent：模型决策的 Plan-Execute-Replan 循环，代码守预算、截止时间与状态真实性"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.50,<3",
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = false
